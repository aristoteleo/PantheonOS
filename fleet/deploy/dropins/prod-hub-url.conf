# HELD prod-cutover drop-in (D-full step 3) — arms hub validation on the prod
# fleet controller (fleet.aristoteleo.com, droplet 581354476). PREPARED 2026-07-06,
# NOT YET APPLIED — do this only inside the coordinated D-full window (see
# deploy/production.md "Prod cutover checklist").
#
# It reissues the controller's EXACT current ExecStart (captured 2026-07-06) and
# appends --hub-url + --hub-token. --allowed-keys-file stays, so static pbk_ keys
# keep working as a fallback (session JWTs now resolve to the user-derived fleet).
#
# BEFORE APPLYING:
#   1. Confirm the ExecStart below still matches the live one:
#        systemctl show -p ExecStart fleet-controller
#      If the relay multiaddr / paths changed, regenerate this line first.
#   2. Replace __PROD_SVCTOKEN__ with the SAME fresh secret set on the prod hub's
#      FLEET_CONTROLLER_SERVICE_TOKEN (generate once, e.g. `openssl rand -hex 32`).
#
# APPLY:
#   scp this to root@24.199.99.134:/etc/systemd/system/fleet-controller.service.d/hub-url.conf
#   ssh root@24.199.99.134 'systemctl daemon-reload && systemctl restart fleet-controller'
#
# REVERT (fully reversible):
#   ssh root@24.199.99.134 'rm /etc/systemd/system/fleet-controller.service.d/hub-url.conf \
#     && systemctl daemon-reload && systemctl restart fleet-controller'

[Service]
ExecStart=
ExecStart=/root/fleet/fleet-controller --auth --addr :8099 --nats tls://fleet.aristoteleo.com:4222 --nats-listen 0.0.0.0:4222 --js-store-dir /root/fleet/js --state-dir /root/fleet/ctl --allowed-keys-file /root/fleet/allowed-keys --relays /ip4/24.199.99.134/udp/4250/quic-v1/p2p/12D3KooWA7CQ4CSu9cjkA3KZepxpKyCcgkbNcCRygQMn42wei6Cz --emit-nats-config /root/fleet/nats.conf --hub-url https://pantheon.aristoteleo.com --hub-token __PROD_SVCTOKEN__
