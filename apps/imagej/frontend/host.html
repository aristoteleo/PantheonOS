<!DOCTYPE html>
<!--
  The app host (docs/app-spec.md §4) — every packaged app window runs this
  page inside a sandboxed iframe.

  Boot: post `hello` to the shell → receive `boot {manifest, frontendUrl}` →
  import the app's frontend module → `setup(app, root)` → `ready`. The shell
  then sends `init {state}` and the app renders.

  SELF-CONTAINED, deliberately. The iframe has `sandbox` without
  `allow-same-origin`, so this document runs with an opaque origin — and an
  opaque origin's fetches to the shell's own origin are cross-origin requests
  the dev server does not CORS. So nothing here imports from the shell: the
  SDK is inlined below (a faithful copy of live-view-sdk.js — same wire
  protocol, so existing viewer adapters run unchanged), and the only network
  the page touches is the pod's CORS data server and the CDN import map.

  Supported module shapes, same as the LiveView host:
    export function setup(app, root)   — render into root (Vue mounts here too)
    export default <ReactComponent>    — host mounts it with `app` as prop
    *.jsx / *.tsx / *.ts               — transpiled in-browser with Sucrase
-->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script>// html2canvas 1.4 predates modern CSS colours. Let the browser resolve them
// on the cloned document, preserving the rendered colours and source DOM.
// Classic script so opaque-origin app-host frames can load it without CORS.
globalThis.atriumSnapshotColors = function normaliseSnapshotColors(doc) {
  const canvas = doc.createElement('canvas')
  canvas.width = canvas.height = 1
  const context = canvas.getContext('2d', { willReadFrequently: true })
  if (!context) throw new Error('could not initialise screenshot colour conversion')
  const properties = [
    'color', 'background-color', 'background-image',
    'border-top-color', 'border-right-color', 'border-bottom-color', 'border-left-color',
    'outline-color', 'column-rule-color', 'text-decoration-color', 'text-emphasis-color',
    'caret-color', 'fill', 'stroke', 'box-shadow', 'text-shadow',
  ]
  const cache = new Map()
  const toRGB = (color) => {
    if (cache.has(color)) return cache.get(color)
    context.clearRect(0, 0, 1, 1)
    context.fillStyle = color
    context.fillRect(0, 0, 1, 1)
    const [r, g, b, a] = context.getImageData(0, 0, 1, 1).data
    const result = `rgba(${r}, ${g}, ${b}, ${a / 255})`
    cache.set(color, result)
    return result
  }
  const convert = (value) => {
    const pattern = /(?:color-mix|color|oklch|oklab|lab|lch|hwb)\(/gi
    let out = '', offset = 0, match
    while ((match = pattern.exec(value))) {
      let end = pattern.lastIndex, depth = 1
      for (; end < value.length && depth; end++) {
        if (value[end] === '(') depth++
        else if (value[end] === ')') depth--
      }
      if (depth) break
      out += value.slice(offset, match.index) + toRGB(value.slice(match.index, end))
      offset = end
      pattern.lastIndex = end
    }
    return out + value.slice(offset)
  }
  const pseudoRules = []
  let seq = 0
  for (const element of doc.querySelectorAll('*')) {
    // html2canvas adopts nodes cloned in the source realm into a new iframe.
    // Their prototypes may still belong to that original realm.
    if (!element.style) continue
    for (const pseudo of ['', '::before', '::after']) {
      const computed = doc.defaultView.getComputedStyle(element, pseudo || null)
      const changed = []
      for (const property of properties) {
        const value = computed.getPropertyValue(property)
        const converted = convert(value)
        if (converted !== value) changed.push([property, converted])
      }
      if (!changed.length) continue
      if (!pseudo) {
        for (const [property, value] of changed) element.style.setProperty(property, value, 'important')
      } else {
        const id = element.getAttribute('data-atrium-snapshot-color') || String(++seq)
        element.setAttribute('data-atrium-snapshot-color', id)
        pseudoRules.push(`[data-atrium-snapshot-color="${id}"]${pseudo}{${changed.map(([p, v]) => `${p}:${v}!important`).join(';')}}`)
      }
    }
  }
  if (pseudoRules.length) {
    const style = doc.createElement('style')
    style.textContent = pseudoRules.join('\n')
    doc.head.appendChild(style)
  }
}
</script>
  <title>Atrium App</title>
  <script>
    // First statement in the document: the frame must not paint the wrong
    // colour even once. `applyTheme` below re-applies whatever the shell
    // sends later; this is only about the first frame.
    (function () {
      var t = new URLSearchParams(location.search).get('theme')
      var el = document.documentElement
      el.dataset.theme = t === 'light' ? 'light' : 'dark'
      el.style.colorScheme = el.dataset.theme
    })()
  </script>
  <style>
    /* The host's OWN chrome — the loading state and whatever shows through
       before the app paints. Keyed on a data-theme set from the URL below,
       so the very first frame is already the right colour; the bridge's
       `theme` message cannot arrive that early. */
    /* The host's own chrome. */
    :root { --host-bg: #111418; --host-fg: #c9d1d9; --host-dim: #8b949e; --host-ring: #30363d; }
    :root[data-theme="light"] { --host-bg: #f4f5f9; --host-fg: #1f2430; --host-dim: #6b7280; --host-ring: #d6d9e0; }

    /* ── the palette an APP may use (docs/app-spec.md) ───────────────────
       Published here so a package does not have to hardcode a colour and
       then be wrong in one of the two themes. Same three-step elevation the
       desktop uses — ground, raised, sunken — plus text weights and one
       accent. An app is free to ignore all of it; an app that uses it
       follows the appearance setting for nothing. */
    :root {
      --app-bg: #111418; --app-raised: #1b2029; --app-sunken: #0b0e13;
      --app-fg: #d7dae0; --app-dim: #9aa1b0; --app-faint: #6b7280;
      --app-border: #2a2f3c; --app-accent: #4c8dff;
    }
    :root[data-theme="light"] {
      --app-bg: #ffffff; --app-raised: #ffffff; --app-sunken: #eef0f5;
      --app-fg: #1f2430; --app-dim: #5a6070; --app-faint: #8b91a1;
      --app-border: #d6d9e0; --app-accent: #2f6fdd;
    }
    html, body, #root { margin: 0; padding: 0; width: 100%; height: 100%; }
    body { background: var(--host-bg); color: var(--host-fg); font-family: system-ui, sans-serif; }
    #status {
      position: absolute; inset: 0; display: flex; align-items: center;
      justify-content: center; flex-direction: column; gap: 10px;
      font-size: 13px; color: var(--host-dim);
    }
    #status.hidden { display: none; }
    .spinner {
      width: 22px; height: 22px; border: 3px solid var(--host-ring);
      border-top-color: #58a6ff; border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .err { color: #f85149; max-width: 80%; text-align: center; white-space: pre-wrap; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "react": "https://esm.sh/react@18.2.0",
      "react/jsx-runtime": "https://esm.sh/react@18.2.0/jsx-runtime",
      "react/jsx-dev-runtime": "https://esm.sh/react@18.2.0/jsx-dev-runtime",
      "react-dom": "https://esm.sh/react-dom@18.2.0",
      "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
      "vue": "https://unpkg.com/vue@3/dist/vue.esm-browser.js",
      "sucrase": "https://esm.sh/sucrase@3.35.0"
    }
  }
  </script>
</head>
<body>
  <div id="root"></div>
  <div id="status"><div class="spinner"></div><div>Loading app…</div></div>

  <script type="module">
    const LV = 1

    // ── Diagnostics capture (same net the LiveView host casts) ──────────
    const seenDiag = new Set()
    let diagCount = 0
    const fmtArg = (x) => {
      if (typeof x === 'string') return x
      if (x instanceof Error) return x.message
      try { return JSON.stringify(x) } catch (_) { return String(x) }
    }
    function postRaw(msg) {
      try { window.parent.postMessage({ __lv: LV, ...msg }, '*') } catch (_) {}
    }
    function postDiag(level, message) {
      message = String(message).slice(0, 1500)
      const key = level + '|' + message
      if (seenDiag.has(key) || diagCount >= 50) return
      seenDiag.add(key)
      diagCount++
      postRaw({ t: 'diag', level, message })
    }
    window.addEventListener('error', (e) => {
      postDiag('error', e.message + (e.filename ? `  (${e.filename}:${e.lineno || 0})` : ''))
    })
    window.addEventListener('unhandledrejection', (e) => {
      const r = e.reason
      postDiag('error', 'Unhandled promise rejection: ' + (r && r.message ? r.message : String(r)))
    })
    const _err = console.error.bind(console)
    const _warn = console.warn.bind(console)
    console.error = (...a) => { postDiag('error', a.map(fmtArg).join(' ')); _err(...a) }
    console.warn = (...a) => { postDiag('warn', a.map(fmtArg).join(' ')); _warn(...a) }

    // ── The SDK, inlined (faithful to live-view-sdk.js; same wire) ──────
    function deepMerge(target, patch) {
      if (patch === null || typeof patch !== 'object' || Array.isArray(patch)) return patch
      const base = target && typeof target === 'object' && !Array.isArray(target) ? target : {}
      const out = { ...base }
      for (const key of Object.keys(patch)) out[key] = deepMerge(base[key], patch[key])
      return out
    }

    function createAppBridge() {
      let state = null
      let stateCb = null
      const actions = new Map()
      const events = new Map()
      let emitTimer = null
      let snapshotProvider = null
      let stateQueue = Promise.resolve()
      let activeChange = null

      // Pending request/response pairs riding the postMessage wire:
      // app.call and app.fs both resolve through here.
      let seq = 0
      const pending = new Map()
      function request(msg, timeoutMs = 30_000) {
        const id = `r${++seq}`
        return new Promise((resolve, reject) => {
          const timer = setTimeout(() => {
            pending.delete(id)
            reject(new Error('request timed out'))
          }, timeoutMs)
          pending.set(id, { resolve, reject, timer })
          post({ ...msg, id })
        })
      }
      function settle(id, ok, value, error) {
        const p = pending.get(id)
        if (!p) return
        pending.delete(id)
        clearTimeout(p.timer)
        if (ok) p.resolve(value)
        else p.reject(new Error(error || 'request failed'))
      }

      const post = (msg) => {
        try {
          const plain = JSON.parse(JSON.stringify({ __lv: LV, ...msg }))
          window.parent.postMessage(plain, '*')
        } catch (e) {
          _err('[app-sdk] postMessage failed', e)
        }
      }
      /**
       * The desktop's appearance, applied to this document.
       *
       * An app in a sandboxed iframe cannot see the shell's stylesheet or the
       * class on its <html>, so the shell posts the answer. Applied here
       * whether or not the app asks: `color-scheme` alone stops the form
       * controls, scrollbars and default backgrounds from being the opposite
       * colour to everything around them, which is the failure an app author
       * would otherwise have to discover and fix by hand in every package.
       *
       * `data-theme` and the class are for the app's own CSS; `atrium.theme`
       * and `onTheme` are for its JavaScript — a canvas or a WebGL viewer has
       * no stylesheet to key off and has to be told in a language it can act
       * on.
       */
      let theme = 'dark'
      let themeCb = null
      const applyTheme = (next) => {
        theme = next === 'light' ? 'light' : 'dark'
        const el = document.documentElement
        el.dataset.theme = theme
        el.classList.toggle('dark-theme', theme === 'dark')
        el.classList.toggle('light-theme', theme === 'light')
        el.style.colorScheme = theme
        if (themeCb) {
          try { themeCb(theme) } catch (e) { postDiag('error', e?.message || e) }
        }
      }

      const fireState = (reason) => {
        const change = activeChange
        let result
        try { result = stateCb?.(state, { reason }) }
        catch (error) { result = Promise.reject(error) }
        const rendered = Promise.resolve(result)
        // setState inside onState can schedule another asynchronous render.
        // Keep those in the same acknowledgement, without making setState's
        // fluent API return a promise (existing adapters rely on it).
        if (change) change.renders.push(rendered)
        rendered.catch((error) => {
          if (change) change.error ??= error
          else post({ t: 'error', message: `onState handler failed: ${error?.message || error}` })
        })
        return rendered
      }
      /**
       * Tell the shell the state changed — debounced, like commit().
       *
       * A state the SHELL handed us still has to travel back, and this used to
       * be missing: `commit` (what the app's own setState calls) posted, while
       * an incoming `patch`/`set` only ran the app's handler. So a slider the
       * user moved propagated to the other viewports and an agent's
       * desktop_update did not — it changed this copy of the app and nothing
       * else, while desktop_read went on answering from the shell's stale
       * cache and reported success.
       *
       * NOT on `init`: that is the shell seeding a new window, and echoing it
       * back would let a viewport that just joined publish its own starting
       * state over what everyone else is already looking at.
       */
      const announceState = () => {
        if (emitTimer) clearTimeout(emitTimer)
        emitTimer = setTimeout(() => {
          emitTimer = null
          post({ t: 'state', state })
        }, 150)
      }
      const commit = (nextState, { debounceMs = 150 } = {}) => {
        state = nextState
        const rendered = fireState('emit')
        // A requested mutation publishes once, after all of its renders.
        if (activeChange) return
        if (emitTimer) clearTimeout(emitTimer)
        emitTimer = setTimeout(() => {
          emitTimer = null
          rendered.then(() => post({ t: 'state', state }), () => {})
        }, debounceMs)
      }

      async function applyStateMessage(m) {
        if (emitTimer) { clearTimeout(emitTimer); emitTimer = null }
        const change = { renders: [], error: null }
        activeChange = change
        try {
          state = m.t === 'patch' ? deepMerge(state, m.patch) : m.state
          fireState(m.t)
          // The list may grow when an adapter normalises input with setState.
          for (let i = 0; i < change.renders.length; i++) await change.renders[i]
          if (change.error) throw change.error
          // Let Vue/React's queued DOM work land before acknowledging it.
          // requestAnimationFrame can be suspended for a window on another
          // desktop space. The event-loop turn still flushes queued DOM work.
          await new Promise((resolve) => setTimeout(resolve, 0))
          if (m.request_id) {
            post({ t: 'state_result', request_id: m.request_id, ok: true, state })
          } else if (m.t !== 'init') {
            announceState()
          }
        } catch (error) {
          const message = `onState handler failed: ${error?.message || error}`
          if (m.request_id) post({ t: 'state_result', request_id: m.request_id, ok: false, error: message })
          else post({ t: 'error', message })
        } finally {
          activeChange = null
        }
      }

      async function applyActionMessage(m) {
        const fn = actions.get(m.name)
        if (!fn) {
          post({ t: 'result', id: m.id, ok: false, error: `No such action: ${m.name}` })
          return
        }
        if (emitTimer) { clearTimeout(emitTimer); emitTimer = null }
        const change = { renders: [], error: null }
        activeChange = change
        try {
          const value = await fn(m.args)
          for (let i = 0; i < change.renders.length; i++) await change.renders[i]
          if (change.error) throw change.error
          await new Promise((resolve) => setTimeout(resolve, 0))
          // Commit and result travel in one message; desktop_read immediately
          // after desktop_call must see the effect that was acknowledged.
          post({ t: 'result', id: m.id, ok: true, value: value ?? null, state })
        } catch (error) {
          post({ t: 'result', id: m.id, ok: false, error: error?.message || String(error) })
        } finally {
          activeChange = null
        }
      }

      window.addEventListener('message', async (ev) => {
        const m = ev.data
        if (!m || m.__lv !== LV) return
        if (m.t === 'theme') {
          applyTheme(m.theme)
          return
        }
        if (m.t === 'init' || m.t === 'set' || m.t === 'patch') {
          // Serialise incoming state changes. RPC/fs replies must remain
          // outside this queue: an async onState may be waiting for one.
          stateQueue = stateQueue.then(() => applyStateMessage(m))
        } else if (m.t === 'action') {
          stateQueue = stateQueue.then(() => applyActionMessage(m))
        } else if (m.t === 'call_result' || m.t === 'fs_result' || m.t === 'win_result') {
          settle(m.id, m.ok, m.t === 'fs_result' ? m : m.result, m.error)
        } else if (m.t === 'event') {
          const cbs = events.get(m.name)
          if (cbs) for (const cb of cbs) { try { cb(m.data) } catch (e) { postDiag('error', e?.message || e) } }
        }
      })

      return {
        get state() { return state },
        onState(cb) { stateCb = cb; if (state !== null) fireState('init'); return this },
        defineAction(name, fn) { actions.set(name, fn); return this },
        emitState(nextState, opts) { commit(nextState, opts); return this },
        setState(patch, opts) { commit(deepMerge(state, patch), opts); return this },
        onSnapshot(fn) { snapshotProvider = fn; return this },
        get snapshotProvider() { return snapshotProvider },
        ready() { post({ t: 'ready' }); return this },
        /** 'dark' | 'light' — the desktop's appearance, already applied here. */
        get theme() { return theme },
        /** Called on every change, and once with the current value. */
        onTheme(cb) { themeCb = cb; try { cb(theme) } catch (e) { postDiag('error', e?.message || e) } return this },
        fail(message) {
          if (activeChange) activeChange.error = new Error(String(message))
          else post({ t: 'error', message: String(message) })
          return this
        },

        // ── the grown surface (docs/app-spec.md §4.3) ──
        call(method, args = {}, { timeoutMs = 30_000 } = {}) {
          // The shell needs the budget too — its pod call must outlive ours.
          return request({ t: 'call', method, args, timeoutMs }, timeoutMs + 15_000)
        },
        onEvent(name, cb) {
          if (!events.has(name)) events.set(name, new Set())
          events.get(name).add(cb)
          return () => events.get(name)?.delete(cb)
        },
        fs: {
          read: (path) => request({ t: 'fs', op: 'read', args: { path } }).then((m) => m.content),
          write: (path, content) => request({ t: 'fs', op: 'write', args: { path, content } }).then(() => undefined),
          ls: (path) => request({ t: 'fs', op: 'ls', args: { path } }).then((m) => m.entries),
        },
        window: {
          // The shell caches inline bytes as an image file and opens the
          // desktop viewer. Allow time for a chunked image transfer.
          openImage: (src) => request({ t: 'win', op: 'openImage', args: { src } }, 120_000).then(() => undefined),
          setTitle: (title) => post({ t: 'win', op: 'setTitle', args: { title } }),
          close: () => post({ t: 'win', op: 'close' }),
          toggleMaximize: () => post({ t: 'win', op: 'toggleMaximize' }),
          // Runtime menus: replaces the manifest's static menus for this
          // window. Same item shape ({label, action, args, separator}) plus
          // `checked` — for menus that mirror live state, like view toggles.
          setMenus: (menus) => post({ t: 'win', op: 'setMenus', args: { menus } }),
        },
      }
    }

    // ── Snapshot (host request → provider or html2canvas fallback) ──────
    let html2canvas = null
    let htmlToImage = null
    async function captureSnapshot() {
      const provider = app && app.snapshotProvider
      if (provider) {
        try {
          const url = await provider()
          if (url) return url
        } catch (e) {
          postDiag('warn', 'snapshot provider failed: ' + ((e && e.message) || e))
        }
      }
      // A pure-SVG view (phylotree, msa) rasterises directly and reliably;
      // html2canvas walks the whole document and, inside a sandboxed frame,
      // trips over cross-origin window access ("Failed to read a named
      // property 'document' from 'Window'") — which made screenshots of
      // those viewers fail every time.
      const svgShot = await captureSvg()
      if (svgShot) return svgShot

      // An opaque-origin workspace app cannot read the temporary iframe that
      // html2canvas creates, even though it created that iframe itself. This
      // small SVG/foreignObject renderer clones in-place without relaxing the
      // app sandbox, and retains DOM text, native colours and canvas pixels.
      if (globalThis.origin === 'null') {
        if (!htmlToImage) {
          await new Promise((resolve, reject) => {
            const script = document.createElement('script')
            script.src = '/vendor/html-to-image-1.11.13.js'
            script.onload = resolve
            script.onerror = () => { script.remove(); reject(new Error('could not load screenshot renderer')) }
            document.head.appendChild(script)
          })
          htmlToImage = globalThis.htmlToImage
        }
        return await htmlToImage.toPng(document.body, {
          pixelRatio: Math.min(1, 1200 / Math.max(document.body.scrollWidth, 1)),
        })
      }

      if (!html2canvas) {
        html2canvas = (await import('https://esm.sh/html2canvas@1.4.1')).default
      }
      const w = Math.max(document.body.scrollWidth, 1)
      const canvas = await html2canvas(document.body, {
        backgroundColor: null,
        logging: false,
        scale: Math.min(1, 1200 / w), useCORS: true,
        onclone: (doc) => globalThis.atriumSnapshotColors(doc),
      })
      return canvas.toDataURL('image/jpeg', 0.85)
    }

    /** Serialise the view's dominant <svg> onto a canvas; null if none. */
    async function captureSvg() {
      const svgs = [...document.querySelectorAll('svg')]
        .filter((el) => el.getBoundingClientRect().width > 80
          && el.getBoundingClientRect().height > 80)
      if (!svgs.length) return null
      const svg = svgs.sort((a, b) => {
        const ra = a.getBoundingClientRect(), rb = b.getBoundingClientRect()
        return rb.width * rb.height - ra.width * ra.height
      })[0]
      try {
        const rect = svg.getBoundingClientRect()
        const clone = svg.cloneNode(true)
        clone.setAttribute('xmlns', 'http://www.w3.org/2000/svg')

        // A serialised SVG carries no document: every rule from an external
        // stylesheet is gone, and viewers style their geometry that way
        // (phylotree's branches are `.branch { stroke: … }` in phylotree.css).
        // Dropping it produced screenshots with labels and NO TREE — which an
        // agent then spent minutes trying to "fix". Copy the paint-bearing
        // computed styles onto the clone, node for node.
        const PAINT = [
          'fill', 'fill-opacity', 'stroke', 'stroke-width', 'stroke-opacity',
          'stroke-dasharray', 'stroke-linecap', 'stroke-linejoin', 'opacity',
          'font-family', 'font-size', 'font-weight', 'font-style', 'text-anchor',
          'dominant-baseline', 'visibility', 'display', 'color',
        ]
        const src = [svg, ...svg.querySelectorAll('*')]
        const dst = [clone, ...clone.querySelectorAll('*')]
        for (let i = 0; i < src.length && i < dst.length; i++) {
          const cs = getComputedStyle(src[i])
          let inline = ''
          for (const prop of PAINT) {
            const v = cs.getPropertyValue(prop)
            if (v) inline += `${prop}:${v};`
          }
          if (inline) dst[i].setAttribute('style', inline + (dst[i].getAttribute('style') || ''))
        }

        // Size by CONTENT, not by the scroll viewport: a radial tree draws
        // outside the box the element happens to occupy, and cropping it is
        // what "a fragment of a tree" looked like.
        let vw = Math.round(rect.width)
        let vh = Math.round(rect.height)
        try {
          const bb = svg.getBBox()
          if (bb.width > 1 && bb.height > 1) {
            const pad = 8
            clone.setAttribute('viewBox',
              `${bb.x - pad} ${bb.y - pad} ${bb.width + pad * 2} ${bb.height + pad * 2}`)
            const ratio = (bb.height + pad * 2) / (bb.width + pad * 2)
            vw = Math.min(1400, Math.max(320, Math.round(bb.width + pad * 2)))
            vh = Math.max(240, Math.round(vw * ratio))
          }
        } catch (e) { /* getBBox throws on a detached/empty SVG */ }
        clone.setAttribute('width', String(vw))
        clone.setAttribute('height', String(vh))
        const xml = new XMLSerializer().serializeToString(clone)
        const url = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(xml)
        const img = await new Promise((resolve, reject) => {
          const i = new Image()
          i.onload = () => resolve(i)
          i.onerror = () => reject(new Error('svg rasterise failed'))
          i.src = url
        })
        const canvas = document.createElement('canvas')
        canvas.width = Math.max(1, vw)
        canvas.height = Math.max(1, vh)
        const ctx = canvas.getContext('2d')
        // The viewers draw on white; keep that rather than a transparent PNG
        // flattened to black by the JPEG encoder.
        ctx.fillStyle = '#ffffff'
        ctx.fillRect(0, 0, canvas.width, canvas.height)
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height)
        return canvas.toDataURL('image/jpeg', 0.85)
      } catch (e) {
        postDiag('warn', 'svg snapshot failed: ' + ((e && e.message) || e))
        return null
      }
    }
    window.addEventListener('message', async (ev) => {
      const m = ev.data
      if (!m || m.__lv !== LV || m.t !== 'snapshot') return
      try {
        const dataUrl = await Promise.race([
          captureSnapshot(),
          new Promise((_, rej) => setTimeout(() => rej(new Error('capture timed out (15s)')), 15000)),
        ])
        postRaw({ t: 'snapshot_result', id: m.id, ok: true, dataUrl })
      } catch (e) {
        postRaw({ t: 'snapshot_result', id: m.id, ok: false, error: String((e && e.message) || e) })
      }
    })

    // ── Boot ────────────────────────────────────────────────────────────
    const statusEl = document.getElementById('status')
    const hideStatus = () => statusEl.classList.add('hidden')
    const showError = (msg) => {
      statusEl.classList.remove('hidden')
      statusEl.innerHTML = `<div class="err">${msg}</div>`
    }

    const app = createAppBridge()
    const root = document.getElementById('root')

    /** Ask the shell who we are. Retried because the shell's listener and
     *  this frame race on a hard reload. */
    function awaitBoot() {
      return new Promise((resolve, reject) => {
        let tries = 0
        const timer = setInterval(() => {
          if (++tries > 50) { clearInterval(timer); reject(new Error('the shell never answered hello')) }
          else postRaw({ t: 'hello' })
        }, 200)
        window.addEventListener('message', function onBoot(ev) {
          const m = ev.data
          if (!m || m.__lv !== LV || m.t !== 'boot') return
          window.removeEventListener('message', onBoot)
          clearInterval(timer)
          resolve(m)
        })
        postRaw({ t: 'hello' })
      })
    }

    async function loadModule(url) {
      if (/\.(jsx|tsx|ts)(\?|$)/.test(url)) {
        const src = await (await fetch(url)).text()
        const { transform } = await import('sucrase')
        const { code } = transform(src, {
          transforms: ['jsx', 'typescript'],
          jsxRuntime: 'automatic', production: true, filePath: url,
        })
        const blobUrl = URL.createObjectURL(new Blob([code], { type: 'text/javascript' }))
        try { return await import(/* @vite-ignore */ blobUrl) }
        finally { URL.revokeObjectURL(blobUrl) }
      }
      return import(/* @vite-ignore */ url)
    }

    try {
      const boot = await awaitBoot()
      const mod = await loadModule(boot.frontendUrl)
      hideStatus()
      if (typeof mod.setup === 'function') {
        // `setup(app, root)` — and `setup(lv, root)` is the same call, which
        // is what lets every existing viewer adapter run here unchanged.
        await mod.setup(app, root)
      } else if (typeof mod.default === 'function') {
        const React = (await import('react')).default
        const { createRoot } = await import('react-dom/client')
        createRoot(root).render(React.createElement(mod.default, { lv: app, app }))
      } else {
        throw new Error('App must export `setup(app, root)` or a default React component.')
      }
      app.ready()
    } catch (e) {
      const msg = `Failed to load app: ${e?.message || e}`
      showError(msg)
      postDiag('error', msg)
      app.fail(msg)
      throw e
    }
  </script>
</body>
</html>
