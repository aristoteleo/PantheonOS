name: store-sync-review

# Sync skill sources from upstream + auto-review new/changed skills, against BOTH
# the staging and prod hubs (matrix), running the CLI loop inside the agent image:
#   1. seed check-updates  — which upstream sources moved
#   2. seed prepare         — clone sources into a local manifest
#   3. seed publish         — re-publish changed skills (auto-versioned, rename-reconciled)
#   4. review --changed_only — score only new / content-changed skills, as the
#                              pantheon-reviewer bot, via the hub API
#
# Embeddings are NOT generated here: the hub embeds (and reviews) event-driven on
# publish (BackgroundTasks in api/store.py), so a fresh `seed publish` is enough
# to keep semantic /recommend current.
#
# Requires repo secrets (the service accounts share one password across staging
# and prod, so a single set of secrets authenticates against both):
#   STORE_PUBLISHER_USER / STORE_PUBLISHER_PASSWORD   account allowed to publish (= store-seed)
#   PANTHEON_REVIEWER_PASSWORD                         password of the `pantheon-reviewer` bot
#   REVIEWER_ANTHROPIC_API_KEY                         LLM key the reviewer scores with

on:
  workflow_dispatch:
    inputs:
      source:
        description: "Source to review (a source label, or 'all')"
        default: "all"
      skip_publish:
        description: "Skip the seed sync/publish — review only"
        type: boolean
        default: false
      review_limit:
        description: "Cap how many skills to review (0 = no cap; use a small number for a first run)"
        default: "0"
  schedule:
    - cron: "0 7 * * *"   # 07:00 UTC nightly — runs both staging + prod

jobs:
  sync-review:
    runs-on: ubuntu-latest
    # Run each hub independently; one env failing must not skip the other.
    strategy:
      fail-fast: false
      matrix:
        target: [staging, prod]
    # Per-env concurrency: the two hubs run in parallel, but a single hub never
    # has two overlapping runs.
    concurrency:
      group: store-sync-review-${{ matrix.target }}
      cancel-in-progress: false
    container:
      image: nanguage/pantheon-agents:latest
    env:
      # Reviewer LLM
      ANTHROPIC_API_KEY: ${{ secrets.REVIEWER_ANTHROPIC_API_KEY }}
      REVIEW_MODEL: claude-sonnet-4-6
      # Reviewer bot (write=api logs in as this user)
      PANTHEON_REVIEWER_USER: pantheon-reviewer
      PANTHEON_REVIEWER_PASSWORD: ${{ secrets.PANTHEON_REVIEWER_PASSWORD }}
    steps:
      - name: Resolve hub URL (${{ matrix.target }})
        run: |
          if [ "${{ matrix.target }}" = "prod" ]; then
            echo "HUB_URL=https://pantheon.aristoteleo.com" >> "$GITHUB_ENV"
          else
            echo "HUB_URL=https://pantheon-staging.aristoteleo.com" >> "$GITHUB_ENV"
          fi

      - name: Sync sources from upstream (${{ matrix.target }})
        if: ${{ github.event.inputs.skip_publish != 'true' }}
        run: |
          set -e
          python -m pantheon store login --hub_url "$HUB_URL" \
            --username "${{ secrets.STORE_PUBLISHER_USER }}" \
            --password "${{ secrets.STORE_PUBLISHER_PASSWORD }}"
          python -m pantheon store seed check-updates --hub_url "$HUB_URL" || true
          python -m pantheon store seed prepare
          python -m pantheon store seed publish --hub_url "$HUB_URL"

      - name: Review new / changed skills (${{ matrix.target }})
        run: |
          python -m pantheon store review \
            --source "${{ github.event.inputs.source || 'all' }}" \
            --changed_only \
            --write api \
            --limit "${{ github.event.inputs.review_limit || '0' }}" \
            --hub_url "$HUB_URL"
