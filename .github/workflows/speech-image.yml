name: Build pinned Fleet speech image

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build, check non-owner access and publish
        id: image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/speaches.Dockerfile
          platforms: linux/amd64
          push: true
          tags: nanguage/pantheon-agents:speech-cpu-sha-${{ github.sha }}
      - name: Record immutable identity
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          printf 'nanguage/pantheon-agents@%s\n' "$DIGEST" | tee speech-image.txt
          cat speech-image.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: speech-image-identity
          path: speech-image.txt
