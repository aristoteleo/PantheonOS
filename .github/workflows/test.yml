name: Tests

on:
  push:
    branches: ["*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      speech_container_only:
        description: 'Run only pinned CPU speech through the real Fleet Docker driver'
        type: boolean
        default: false

jobs:
  test:
    if: ${{ inputs.speech_container_only != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
      fail-fast: false

    services:
      nats:
        image: nats:latest
        ports:
          - 4222:4222
          - 8222:8222

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache uv dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ matrix.python-version }}-${{ hashFiles('**/pyproject.toml', '**/uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-${{ matrix.python-version }}-
            ${{ runner.os }}-uv-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev

      - name: Install uv
        uses: astral-sh/setup-uv@v2

      - name: Install project dependencies
        run: uv sync --extra dev --extra knowledge

      - name: Run all tests (core, NATS, and API-dependent)
        env:
          # Override NATS_SERVERS for GitHub Actions (conftest.py will use this if set)
          NATS_SERVERS: "nats://localhost:4222"
          # Set API key from GitHub Secrets (takes priority over .env)
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          # List all tests for debugging
          uv run pytest -v tests/ --collect-only -q 2>&1 | tail -20

          # Run tests with timeout, skipping tests that require external services or have async cleanup issues
          uv run pytest -v tests/ \
            --timeout=60 \
            --timeout-method=thread \
            --ignore=tests/test_learning.py \
            --ignore=tests/test_unified_mcp.py \
            --ignore=tests/test_context_isolation.py \
            --ignore=tests/test_team_transfer_and_call_agent.py \
            --ignore=tests/test_nats_streaming.py \
            --ignore=tests/test_remote_agent.py \
            --ignore=tests/test_use_remote_toolset.py \
            --ignore=tests/test_toolsets.py \
            --ignore=tests/test_knowledge.py \
            --tb=short \
            --junit-xml=test-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-py${{ matrix.python-version }}
          path: test-results.xml
          retention-days: 5

  speech-container:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.speech_container_only == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: fleet/go.mod
          cache-dependency-path: fleet/go.sum
      - name: Pull pinned CPU speech image
        run: |
          image=$(python3 -c "import json; print(next(r['image'] for r in json.load(open('apps/model-service/engines.json'))['recipes'] if r['id']=='speaches-0.9.0-rc.3-linux-amd64-cpu'))")
          timeout 8m docker pull "$image"
      - name: Exercise actual Fleet Docker ownership and speech lifecycle
        working-directory: fleet
        env:
          FLEET_TEST_SPEECH_DOCKER: '1'
        run: |
          set -o pipefail
          go test -p 2 ./internal/lifecycle -run '^TestManagedSpeechDockerLifecycle$' -count=1 -v -timeout 18m | tee "$RUNNER_TEMP/speech-container.log"
      - name: Preserve speech lifecycle evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: speech-container-acceptance
          path: ${{ runner.temp }}/speech-container.log
          retention-days: 7
